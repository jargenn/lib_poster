[package]
name = "lib_poster"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "OAuth and Facebook publishing clients for poster applications"
homepage = "https://github.com/jargenn/lib_poster"
repository = "https://github.com/jargenn/lib_poster"
license = "MIT"
readme = "README.md"
keywords = ["oauth", "facebook", "social-media"]
categories = ["api-bindings", "web-programming"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE*"]

[lib]
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
tracing = "0.1.44"
url = "2.5.7"
serde = "1.0.228"
serde_json = "1.0.147"
oauth2 = "5.0.0"
thiserror = "2.0.17"
unicode-segmentation = "1.12.0"
time = { version = "0.3.44", features = ["formatting", "parsing", "serde"], optional = true }

[features]
default = ["time"]
time = ["dep:time"]

[dev-dependencies]
expect-test = "1.5"
pretty_assertions = "1.4"
quickcheck = "1"
quickcheck_macros = "1"
